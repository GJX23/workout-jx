const COLORS={Push:'#ffb46c',Pull:'#64dada',Leg:'#c9fd6a',HIIT:'#ff99c4'};
function icon(name){return `<svg class="icon" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#ic-${name}"></use></svg>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clone(x){return JSON.parse(JSON.stringify(x))}
function todayISO(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function toDate(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d||1)}
function nextDate(s,n){const d=toDate(s);d.setDate(d.getDate()+n);return todayISO(d)}
function weekStart(s){const d=toDate(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return todayISO(d)}
function niceDate(s,opts){return toDate(s).toLocaleDateString('de-AT',opts||{day:'2-digit',month:'short',year:'numeric'})}
function monthKey(s){return s.slice(0,7)}
function compact(n){return Number(n).toLocaleString('de-AT',{maximumFractionDigits:0})}
function formatWeight(n){return Number(n).toLocaleString('de-AT',{maximumFractionDigits:1})}
function mkDb(){return {version:2,sessions:clone(INITIAL_SESSIONS),plan:clone(PLAN_DEFAULT),body:[],settings:{weeklyGoal:3,sound:true,vibrate:true}}}
function restore(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return mkDb();const d=JSON.parse(raw);return {version:2,sessions:Array.isArray(d.sessions)?d.sessions:clone(INITIAL_SESSIONS),plan:d.plan&&typeof d.plan==='object'?d.plan:clone(PLAN_DEFAULT),body:Array.isArray(d.body)?d.body:[],settings:{weeklyGoal:3,sound:true,vibrate:true,...(d.settings||{})}}}catch(e){console.warn('Speicherzugriff nicht möglich',e);return mkDb()}}
let db=restore(),page='dashboard',month=new Date(),selectedDay=todayISO(),split='Push',capture=false,draft=null,activeExercise=null,weightMetric='Beinpresse',timer={running:false,elapsed:0,startedAt:0,phase:-1,completed:false,recorded:false};let timerHandle=null,audioCtx=null,wakeLock=null;
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db));return true}catch(e){toast('Speichern im Browser blockiert: Bitte JSON-Backup nutzen.');return false}}
function toast(m){const p=document.createElement('div');p.className='toast';p.textContent=m;document.getElementById('toasts').append(p);setTimeout(()=>p.remove(),3200)}
function done(){return db.sessions.filter(x=>x.status==='Erledigt')}
function loggedVolume(s){return (s.exercises||[]).reduce((sum,e)=>sum+(e.sets||[]).reduce((a,t)=>a+(Number(t.kg)||0)*(Number(t.reps)||0),0),0)}
function sessionDateCounts(day){return db.sessions.filter(x=>x.date===day)}
function renderNav(){for(const id of ['side-nav','mobile-nav']){document.getElementById(id).innerHTML=NAV.map(([key,label,ic])=>`<button type="button" data-nav="${key}" class="${page===key?'active':''}">${icon(ic)}<span>${label}</span></button>`).join('')}}
function go(p){if(!NAV.some(x=>x[0]===p))p='dashboard';page=p;document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id==='view-'+page));const n=NAV.find(x=>x[0]===page);document.getElementById('page-kicker').textContent=n[3];document.getElementById('page-title').textContent=n[4];renderNav();renderCurrent();window.scrollTo({top:0,behavior:'instant'})}
function renderCurrent(){if(page==='dashboard')renderDashboard();if(page==='calendar')renderCalendar();if(page==='training')renderTraining();if(page==='hiit')renderHiit();if(page==='progress')renderProgress();if(page==='settings')renderSettings();document.getElementById('side-count').textContent=done().length+' dokumentierte Einheiten';document.getElementById('header-date').textContent=new Date().toLocaleDateString('de-AT',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})}
function renderAll(){renderCurrent()}
function weekSeries(n=9){const first=weekStart(todayISO());let a=[];for(let i=n-1;i>=0;i--){const w=nextDate(first,-7*i);const list=done().filter(s=>weekStart(s.date)===w);a.push({key:w,label:niceDate(w,{day:'numeric',month:'numeric'}),Push:list.filter(x=>x.type==='Push').length,Pull:list.filter(x=>x.type==='Pull').length,Leg:list.filter(x=>x.type==='Leg').length,HIIT:list.filter(x=>x.type==='HIIT').length,volume:list.reduce((t,s)=>t+loggedVolume(s),0)})}return a}
function lineChart(values,labels,color='#c9fd6a',suffix=''){const w=620,h=210,pad={l:38,r:15,t:20,b:30};const max=Math.max(1,...values)*1.15;const X=i=>pad.l+(w-pad.l-pad.r)*(values.length===1?.5:i/(values.length-1));const Y=v=>h-pad.b-v/max*(h-pad.t-pad.b);const grid=[0,.25,.5,.75,1].map(f=>{const y=Y(max*f);return `<line class="chart-grid" x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}"/><text class="chart-label" text-anchor="end" x="${pad.l-8}" y="${y+4}">${compact(max*f)}${suffix}</text>`}).join('');const pts=values.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');const dots=values.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${color}"/><title>${esc(labels[i])}: ${formatWeight(v)}${suffix}</title>`).join('');return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Verlaufsdiagramm">${grid}<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}${labels.map((l,i)=>`<text class="chart-label" text-anchor="middle" x="${X(i)}" y="${h-9}">${esc(l)}</text>`).join('')}</svg>`}
function stackedChart(data){const w=620,h=230,l=32,r=12,t=18,b=34;const max=Math.max(3,...data.map(x=>x.Push+x.Pull+x.Leg+x.HIIT));const plot=h-t-b;const block=(w-l-r)/data.length;let str=[0,Math.ceil(max/2),max].map(y=>`<line class="chart-grid" x1="${l}" x2="${w-r}" y1="${h-b-y/max*plot}" y2="${h-b-y/max*plot}"/><text class="chart-label" x="${l-8}" y="${h-b-y/max*plot+4}" text-anchor="end">${y}</text>`).join('');data.forEach((d,i)=>{let bottom=h-b;const x=l+i*block+block*.21;const width=block*.58;['Push','Pull','Leg','HIIT'].forEach(key=>{const v=d[key];if(v){const height=v/max*plot;bottom-=height;str+=`<rect x="${x}" y="${bottom}" width="${width}" height="${height}" fill="${COLORS[key]}" rx="2" ><title>${key}: ${v}</title></rect>`}});str+=`<text class="chart-label" x="${x+width/2}" y="${h-10}" text-anchor="middle">${esc(d.label)}</text>`});return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Trainingseinheiten der letzten Wochen">${str}</svg><div class="legend">${['Push','Pull','Leg','HIIT'].map(s=>`<span><i style="background:${COLORS[s]}"></i>${s==='Leg'?'Legs':s}</span>`).join('')}</div>`}
function renderDashboard(){const list=done(),now=todayISO(),ws=weekStart(now);const week=list.filter(x=>weekStart(x.date)===ws);const last30=nextDate(now,-29);const recent=list.filter(x=>x.date>=last30&&x.date<=now);const weeklyGoal=Math.max(1,Number(db.settings.weeklyGoal)||3);const pct=Math.min(100,Math.round(week.length/weeklyGoal*100));const vol=list.reduce((v,x)=>v+loggedVolume(x),0);const latest=[...list].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);const noVol=vol===0;const hist=list.filter(x=>x.imported).length;document.getElementById('view-dashboard').innerHTML=`<div class="hero"><div><div class="small">DISCIPLINE BUILDS RESULTS</div><h3>Jede Einheit zählt.<br>Dein Fortschritt ist messbar.</h3><p>Dein persönliches PPL- & HIIT-Kontrollzentrum.</p><div class="hero-actions"><button class="btn" data-action="new-session">+ Training erfassen</button><button class="btn secondary" data-nav="hiit">HIIT starten ${icon('timer')}</button></div></div><div class="hero-mark">↗</div></div>
${db.sessions.length===0?`<div class="panel" style="border-color:#526844;background:#1b2923"><h3 style="margin:0 0 8px">Dein privater Trainingsverlauf</h3><p class="sub" style="margin-bottom:13px">Die öffentliche App startet absichtlich ohne persönliche Daten. Importiere deine <strong>private JSON-Datei</strong> einmalig auf diesem Gerät. Lade die JSON-Datei niemals auf GitHub oder Netlify hoch.</p><button class="btn" data-action="import-json">↑ Private Trainingsdaten importieren</button></div>`:''}<div class="stat-grid"><div class="stat"><div class="stat-label">TRAINING DIESER WOCHE</div><div class="stat-value"><b class="accent">${week.length}</b><span style="color:var(--muted);font-size:17px"> / ${weeklyGoal}</span></div><div class="stat-foot">Seit ${niceDate(ws,{day:'2-digit',month:'short'})}</div></div><div class="stat"><div class="stat-label">LETZTE 30 TAGE</div><div class="stat-value">${recent.length}</div><div class="stat-foot">Dokumentierte Einheiten</div></div><div class="stat"><div class="stat-label">GESAMT ERLEDIGT</div><div class="stat-value">${list.length}</div><div class="stat-foot">Davon ${hist} historische Einträge</div></div><div class="stat"><div class="stat-label">DOKUMENTIERTES VOLUMEN</div><div class="stat-value">${compact(vol)} <span style="font-size:14px;color:var(--muted)">kg</span></div><div class="stat-foot">Nur Sätze mit Gewichten erfasst</div></div></div>
<div class="grid-2"><div class="panel"><div class="panel-heading"><div><h3>Aktivität nach Wochen</h3><p class="sub">Die letzten 9 Kalenderwochen</p></div><span class="tag plan">LIVE</span></div><div class="chart-wrap">${stackedChart(weekSeries())}</div></div><div class="panel"><div class="panel-heading"><div><h3>Wochenziel</h3><p class="sub">Dein Trainingsrhythmus</p></div></div><div class="progress-flex"><div class="ring" style="--pct:${pct}%"><div class="inner"><strong>${week.length}/${weeklyGoal}</strong><span>Einheiten</span></div></div><div class="progress-text"><strong>${week.length>=weeklyGoal?'Ziel erreicht!':'Noch '+Math.max(0,weeklyGoal-week.length)+' Einheit(en) offen'}</strong><p>Jede abgeschlossene Einheit zählt – Push, Pull, Legs und HIIT. Du kannst dein Wochenziel unter „Daten“ ändern.</p><span class="tag ${week.length>=weeklyGoal?'leg':'plan'}">${pct}% geschafft</span></div></div></div></div>
<div class="grid-2 equal"><div class="panel"><div class="panel-heading"><h3>Letzte Trainingseinheiten</h3><button class="btn tiny secondary" data-nav="calendar">Alle ansehen</button></div>${latest.length?`<div class="rows">${latest.map(s=>activityHTML(s,false)).join('')}</div>`:'<div class="empty">Hier erscheinen deine absolvierten Einheiten.</div>'}</div><div class="panel"><div class="panel-heading"><h3>Dein Trainingssplit</h3><button class="btn tiny secondary" data-nav="training">Plan öffnen</button></div><div class="rows">${['Push','Pull','Leg','HIIT'].map(t=>`<div class="activity-row"><div class="activity-left"><span class="tag ${t.toLowerCase()}">${t==='Leg'?'LEGS':t.toUpperCase()}</span><div class="activity-title">${t==='Push'?'Brust · Schulter · Trizeps':t==='Pull'?'Rücken · Bizeps · Core':t==='Leg'?'Beine · Waden':'Ausdauer · Core'}</div></div><b>${list.filter(x=>x.type===t).length}</b></div>`).join('')}</div>${noVol?'<p class="note">Historische Gewichte wurden nicht geschätzt. Das Trainingsvolumen wächst ab deinen neuen Satzprotokollen.</p>':''}</div></div>`}
function activityHTML(s,edit){const kind=s.type.toLowerCase();const v=loggedVolume(s);return `<div class="activity-row"><div class="activity-left"><div class="activity-icon">${s.type==='HIIT'?'◉':'↗'}</div><div><div class="activity-title">${esc(s.type==='Leg'?'LEGS':s.type)} <span class="tag ${kind}">${s.status==='Erledigt'?'Erledigt':esc(s.status)}</span></div><div class="activity-desc">${niceDate(s.date)}${s.duration?' · '+s.duration+' min':''}${v?' · '+compact(v)+' kg':''}${s.imported?' · Import':''}</div></div></div>${edit?`<div class="row-inline"><button class="btn tiny secondary" data-action="edit-session" data-id="${esc(s.id)}">Bearbeiten</button><button class="btn tiny danger" data-action="delete-session" data-id="${esc(s.id)}" aria-label="Eintrag löschen">×</button></div>`:''}</div>`}
function renderCalendar(){const y=month.getFullYear(),m=month.getMonth();const first=new Date(y,m,1);const pad=(first.getDay()+6)%7;const days=new Date(y,m+1,0).getDate();const cells=Math.ceil((pad+days)/7)*7;let dayTiles='';const now=todayISO();for(let i=0;i<cells;i++){const dat=new Date(y,m,1-pad+i);const iso=todayISO(dat);const ss=sessionDateCounts(iso);dayTiles+=`<button type="button" class="day ${dat.getMonth()!==m?'outside':''} ${iso===now?'today':''} ${iso===selectedDay?'selected':''}" data-day="${iso}" aria-label="${niceDate(iso)}: ${ss.length} Termine"><span class="day-number">${dat.getDate()}</span><span class="dots">${ss.slice(0,6).map(s=>`<i class="dot ${s.status==='Erledigt'?s.type.toLowerCase():'skipped'}"></i>`).join('')}</span><span class="day-count">${ss.length?ss.length+' Termin'+(ss.length>1?'e':''):''}</span></button>`}
const c=db.sessions.filter(s=>s.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`));const finished=c.filter(x=>x.status==='Erledigt');document.getElementById('view-calendar').innerHTML=`<div class="panel"><div class="calendar-toolbar"><div class="calendar-title">${first.toLocaleDateString('de-AT',{month:'long',year:'numeric'})}</div><div class="calendar-actions"><button class="arrow-btn" data-action="month-prev" aria-label="Vorheriger Monat">‹</button><button class="btn tiny secondary" data-action="month-today">Heute</button><button class="arrow-btn" data-action="month-next" aria-label="Nächster Monat">›</button></div></div><div class="calendar">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(s=>`<div class="weekday">${s}</div>`).join('')}${dayTiles}</div><p class="calendar-summary">${finished.length} Trainingseinheiten im Monat · ${c.filter(x=>x.status==='Ausgefallen').length} ausgefallen · Tippe auf einen Tag zum Öffnen.</p><div class="legend">${['Push','Pull','Leg','HIIT'].map(s=>`<span><i style="background:${COLORS[s]}"></i>${s}</span>`).join('')}<span><i style="background:var(--red)"></i>Ausgefallen</span></div></div><div class="panel"><div class="panel-heading"><h3>Einheiten im Monat</h3><button class="btn tiny" data-action="new-session">+ Hinzufügen</button></div>${c.length?c.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15).map(s=>activityHTML(s,true)).join(''):'<div class="empty">Noch kein Training in diesem Monat erfasst.</div>'}</div>`}
function openDay(date){selectedDay=date;const ss=sessionDateCounts(date);const html=`<h3>${niceDate(date,{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</h3>${ss.length?ss.map(s=>activityHTML(s,true)).join(''):'<div class="empty">Noch kein Eintrag für diesen Tag.</div>'}<div class="modal-bottom"><button class="btn secondary" data-action="close-modal">Schließen</button><button class="btn" data-action="new-session" data-date="${date}">+ Einheit erfassen</button></div>`;document.getElementById('modal-content').innerHTML=html;document.getElementById('modal').showModal()}
function planExercises(){return Array.isArray(db.plan[split])?db.plan[split]:[]}
function sessionExCard(e,i,mode='plan'){const editable=mode==='plan';const sets=(e.sets||[]);return `<div class="exercise-card"><div class="exercise-head"><div><h4><span style="color:var(--lime);font-size:11px">${String(i+1).padStart(2,'0')}</span> &nbsp;${esc(e.name)}</h4><small>${sets.length} Arbeitssätze · ${e.assistance?'Gegengewicht am Gerät':e.note?esc(e.note):'kg / Wiederholungen frei anpassbar'}</small></div>${editable?`<button class="btn tiny secondary" data-action="remove-exercise" data-index="${i}" title="Übung entfernen">Entfernen</button>`:''}</div><div class="set-grid"><span class="set-head">Satz</span><span class="set-head">${e.assistance?'Gegengewicht (kg)':'Gewicht (kg)'}</span><span class="set-head">Wiederholungen</span>${sets.map((s,j)=>`<span class="set-index">${j+1}.</span><input aria-label="Gewicht Satz ${j+1}, ${esc(e.name)}" class="input" type="number" inputmode="decimal" step="0.5" min="0" placeholder="–" value="${s.kg===null||s.kg===''?'':esc(s.kg)}" data-set-field="kg" data-scope="${mode}" data-ex="${i}" data-set="${j}"><input aria-label="Wiederholungen Satz ${j+1}, ${esc(e.name)}" class="input" type="number" inputmode="numeric" min="0" step="1" placeholder="–" value="${s.reps===null||s.reps===''?'':esc(s.reps)}" data-set-field="reps" data-scope="${mode}" data-ex="${i}" data-set="${j}">`).join('')}</div>${editable?`<div class="row-inline" style="margin-top:12px"><button class="btn tiny secondary" data-action="add-set" data-index="${i}">+ Satz</button>${sets.length>1?`<button class="btn tiny secondary" data-action="remove-set" data-index="${i}">− Satz</button>`:''}</div>`:''}</div>`}
function renderTraining(){const ex=planExercises();const title={'Push':'Brust · Schulter · Trizeps','Pull':'Rücken · Bizeps · Core','Leg':'Beine · Waden'}[split];if(!capture){document.getElementById('view-training').innerHTML=`<div class="panel"><div class="split-row"><div><h3>PPL-Trainingsvorlage</h3><p class="sub">Öffentliche Vorlage ohne persönliche Gewichte. Importiere deine private JSON-Sicherung für deine früheren Gewichte.</p></div><button class="btn" data-action="begin-training">+ ${split==='Leg'?'LEGS':split} protokollieren</button></div><div class="divider"></div><div class="segmented">${['Push','Pull','Leg'].map(s=>`<button class="${split===s?'active':''}" data-split="${s}">${s==='Leg'?'LEGS':s.toUpperCase()}</button>`).join('')}</div><div class="panel-heading" style="margin-top:19px"><div><h3>${title}</h3><p class="sub">${ex.length} Übungen · ${ex.reduce((n,e)=>n+e.sets.length,0)} Sätze</p></div></div><div class="mini-help">Du kannst Gewichte und Wiederholungen direkt ändern. Deine Vorlage wird automatisch gespeichert; absolvierte Trainings bleiben unverändert.</div>${ex.map((e,i)=>sessionExCard(e,i)).join('')}<div class="row-inline"><button class="btn secondary" data-action="add-exercise">+ Übung hinzufügen</button><button class="btn" data-action="begin-training">Training erfassen</button></div></div>`;return}
if(!draft){capture=false;renderTraining();return}
const selected=draft.type;const exs=draft.exercises||[];document.getElementById('view-training').innerHTML=`<div class="panel"><div class="split-row"><div><div class="eyebrow">TRAININGSPROTOKOLL</div><h3 style="margin-top:7px">${esc(draft.editing?'Training bearbeiten':'Neue Trainingseinheit')}</h3><p class="sub">Die Vorlage dient als Startwert. Passe die tatsächlich absolvierten Sätze an.</p></div><button class="btn secondary tiny" data-action="stop-training">← Zur Vorlage</button></div><div class="divider"></div><div class="form-grid"><div class="field"><label for="train-date">Datum</label><input class="input" id="train-date" type="date" value="${esc(draft.date)}"></div><div class="field"><label for="train-type">Training</label><select id="train-type" class="input">${['Push','Pull','Leg','HIIT'].map(s=>`<option ${selected===s?'selected':''} value="${s}">${s==='Leg'?'LEGS':s}</option>`).join('')}</select></div><div class="field"><label for="train-duration">Dauer (min)</label><input class="input" id="train-duration" type="number" inputmode="numeric" min="0" max="360" value="${esc(draft.duration??'')}"></div><div class="field"><label for="train-rpe">Belastung RPE (1–10)</label><input class="input" id="train-rpe" type="number" inputmode="numeric" min="1" max="10" value="${esc(draft.rpe??'')}"></div></div><div class="field" style="margin-top:13px"><label for="train-note">Notiz (optional)</label><input class="input" id="train-note" placeholder="z. B. Energie, Regeneration, Besonderheiten" value="${esc(draft.note||'')}"></div><div class="divider"></div><h3 style="margin-bottom:12px">Absolvierte Sätze</h3>${selected==='HIIT'?'<p class="note">HIIT wird als eine Einheit gespeichert. Intervalle kannst du separat im Timer ausführen.</p>':exs.map((e,i)=>sessionExCard(e,i,'draft')).join('')}<div class="row-inline"><button class="btn" data-action="save-session">✓ Einheit speichern</button><button class="btn secondary" data-action="stop-training">Abbrechen</button></div></div>`}
function updateDraftField(id,value){if(!draft)return;const map={'train-date':'date','train-duration':'duration','train-rpe':'rpe','train-note':'note'};if(map[id])draft[map[id]]=value;if(id==='train-type'){draft.type=value;draft.exercises=value==='HIIT'?[]:clone(db.plan[value]||[]);renderTraining()}}
function beginTraining(date=todayISO(),type=split){capture=true;draft={id:'JX-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),date,type,duration:'',rpe:'',note:'',status:'Erledigt',exercises:type==='HIIT'?[]:clone(db.plan[type]||[])};split=type==='HIIT'?'Push':type;document.getElementById('modal').close();go('training')}
function saveSession(){if(!draft)return;const date=draft.date;const n=Number(draft.duration),r=Number(draft.rpe);if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(toDate(date).getTime()))return toast('Bitte gültiges Datum eingeben.');if(draft.duration!==''&&(!Number.isFinite(n)||n<0||n>360))return toast('Dauer muss zwischen 0 und 360 Minuten liegen.');if(draft.rpe!==''&&(!Number.isFinite(r)||r<1||r>10))return toast('RPE muss zwischen 1 und 10 liegen.');for(const e of draft.exercises||[])for(const s of e.sets||[])if((s.kg!==null&&(s.kg<0||s.kg>1000))||(s.reps!==null&&(s.reps<0||s.reps>999)))return toast('Bitte Satzwerte prüfen.');const ses={...clone(draft),date,imported:false,duration:draft.duration===''?null:n,rpe:draft.rpe===''?null:r};delete ses.editing;const idx=db.sessions.findIndex(x=>x.id===ses.id);if(idx>=0)db.sessions[idx]=ses;else db.sessions.push(ses);persist();draft=null;capture=false;toast('Trainingseinheit gespeichert ✓');go('dashboard')}
function deleteSession(id){const s=db.sessions.find(x=>x.id===id);if(!s)return;if(!confirm(`Eintrag ${s.type} vom ${niceDate(s.date)} wirklich löschen?`))return;db.sessions=db.sessions.filter(x=>x.id!==id);document.getElementById('modal').close();persist();renderCurrent();toast('Eintrag gelöscht')}
function editSession(id){const s=db.sessions.find(x=>x.id===id);if(!s)return;draft=clone(s);if(s.type!=='HIIT'&&(!draft.exercises||!draft.exercises.length)){draft.exercises=clone(db.plan[s.type]||[]).map(e=>({...e,sets:e.sets.map(()=>({kg:null,reps:null}))}))}draft.editing=true;capture=true;split=s.type==='HIIT'?'Push':s.type;document.getElementById('modal').close();go('training')}
const totalSecs=HIIT_STEPS.reduce((a,b)=>a+b.sec,0);const activeSecs=HIIT_STEPS.filter(s=>s.cat==='Aktiv').reduce((a,b)=>a+b.sec,0);
function secsToStr(n){n=Math.max(0,Math.ceil(n));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function phaseAt(sec){let t=0;for(let i=0;i<HIIT_STEPS.length;i++){const e=HIIT_STEPS[i];if(sec<t+e.sec)return {i,remaining:t+e.sec-sec,into:sec-t};t+=e.sec}return{i:HIIT_STEPS.length,remaining:0,into:0}}
function currentElapsed(){return Math.min(totalSecs,timer.elapsed+(timer.running?(Date.now()-timer.startedAt)/1000:0))}
function beep(){if(!db.settings.sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx=audioCtx||new C();if(audioCtx.state==='suspended')audioCtx.resume();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=740;gain.gain.setValueAtTime(.0001,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.11,audioCtx.currentTime+.02);gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.17);osc.connect(gain).connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+.18)}catch(e){}}
function vibrate(){if(db.settings.vibrate&&navigator.vibrate)try{navigator.vibrate(55)}catch(e){}}
async function acquireWake(){try{if('wakeLock' in navigator&&timer.running)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseWake(){try{wakeLock?.release()}catch(e){}wakeLock=null}
function startTimer(){if(timer.completed){timer={running:false,elapsed:0,startedAt:0,phase:-1,completed:false,recorded:false}}if(timer.running)return;timer.startedAt=Date.now();timer.running=true;try{if(window.AudioContext){audioCtx=audioCtx||new AudioContext();audioCtx.resume()}}catch(e){}acquireWake();clearInterval(timerHandle);timerHandle=setInterval(updateTimer,130);updateTimer()}
function pauseTimer(){if(timer.running){timer.elapsed=currentElapsed();timer.running=false;clearInterval(timerHandle);releaseWake();updateTimer()}}
function resetTimer(){pauseTimer();timer={running:false,elapsed:0,startedAt:0,phase:-1,completed:false,recorded:false};renderHiit()}
function skipPhase(n){const phase=phaseAt(currentElapsed());const target=n>0?Math.min(HIIT_STEPS.length,phase.i+1):Math.max(0,phase.i-1);const sec=HIIT_STEPS.slice(0,target).reduce((sum,s)=>sum+s.sec,0);timer.elapsed=sec;timer.startedAt=Date.now();timer.completed=sec>=totalSecs;timer.phase=-1;updateTimer()}
function updateTimer(){if(page!=='hiit')return;const elapsed=currentElapsed();const {i,remaining}=phaseAt(elapsed);if(i!==timer.phase){if(timer.phase!==-1){beep();vibrate()}timer.phase=i}if(elapsed>=totalSecs&&!timer.completed){timer.elapsed=totalSecs;timer.completed=true;timer.running=false;clearInterval(timerHandle);releaseWake();toast('HIIT abgeschlossen! Einheit jetzt speichern.')}const st=HIIT_STEPS[i];const $=id=>document.getElementById(id);if(!$('timer-time'))return;$('timer-time').textContent=secsToStr(remaining);$('timer-name').textContent=st?st.name:'HIIT abgeschlossen';$('timer-badge').textContent=st?st.cat.toUpperCase(): 'FINISH';$('timer-next').textContent=st?`Als Nächstes: ${HIIT_STEPS[i+1]?.name||'Fertig'}`:'Stark! Protokolliere dein HIIT-Training.';$('timer-bar').firstElementChild.style.width=`${elapsed/totalSecs*100}%`;$('timer-progress').textContent=`${secsToStr(elapsed)} / ${secsToStr(totalSecs)}`;$('timer-play').textContent=timer.running?'❚❚ Pause':timer.completed?'↻ Neustart':'▶ Start / Fortsetzen';$('timer-save').disabled=!timer.completed||timer.recorded;const old=document.querySelector('.timer-line.active');old?.classList.remove('active');document.querySelectorAll('.timer-line').forEach((el,k)=>{el.classList.toggle('past',k<i);el.classList.toggle('active',k===i)})}
function renderHiit(){let selected=phaseAt(currentElapsed());document.getElementById('view-hiit').innerHTML=`<div class="timer-layout"><div><div class="timer-stage"><span class="timer-badge" id="timer-badge">${esc(HIIT_STEPS[selected.i]?.cat?.toUpperCase()||'FINISH')}</span><div class="timer-name" id="timer-name">${esc(HIIT_STEPS[selected.i]?.name||'HIIT abgeschlossen')}</div><div class="timer-time" id="timer-time">${secsToStr(selected.remaining)}</div><div class="timer-next" id="timer-next">Als Nächstes: ${esc(HIIT_STEPS[selected.i+1]?.name||'Fertig')}</div><div class="timer-bar" id="timer-bar"><i style="width:${currentElapsed()/totalSecs*100}%"></i></div><div class="split-row" style="margin-bottom:17px"><span class="note">Gesamtfortschritt</span><strong id="timer-progress">${secsToStr(currentElapsed())} / ${secsToStr(totalSecs)}</strong></div><div class="timer-controls"><button class="btn secondary" data-action="timer-back">‹</button><button class="btn" id="timer-play" data-action="timer-toggle">${timer.running?'❚❚ Pause':'▶ Start / Fortsetzen'}</button><button class="btn secondary" data-action="timer-forward">›</button><button class="btn secondary" data-action="timer-reset">↻</button></div></div><div class="panel" style="margin-top:16px"><div class="split-row"><div><h3>HIIT JX Original</h3><p class="sub">60 Intervalle · ${secsToStr(activeSecs)} aktive Zeit</p></div><button class="btn tiny" id="timer-save" data-action="timer-save" ${timer.completed&&!timer.recorded?'':'disabled'}>✓ HIIT speichern</button></div><div class="divider"></div><label class="switch"><input type="checkbox" id="sound-toggle" ${db.settings.sound?'checked':''}> Tonsignal bei Wechsel</label><label class="switch" style="margin-left:12px"><input type="checkbox" id="vibrate-toggle" ${db.settings.vibrate?'checked':''}> Vibration</label><p class="note" style="margin-top:10px">Für verlässliche Intervalle die App während des Trainings im Vordergrund lassen. Das Display bleibt auf unterstützten Geräten automatisch aktiv.</p></div></div><div class="panel"><div class="panel-heading"><div><h3>Intervallfolge</h3><p class="sub">Die Reihenfolge aus deinem Trainingsdashboard.</p></div><span class="tag hiit">${HIIT_STEPS.length} PHASEN</span></div><div class="timer-list">${HIIT_STEPS.map((s,i)=>`<div class="timer-line ${i===selected.i?'active':''} ${i<selected.i?'past':''}"><span><small>${String(i+1).padStart(2,'0')}</small>&nbsp; ${esc(s.name)}</span><span><span class="tag ${s.cat==='Aktiv'?'leg':'plan'}">${s.sec}s</span></span></div>`).join('')}</div></div></div>`;updateTimer()}
function recordHiit(){if(!timer.completed||timer.recorded)return;const s={id:'JX-HIIT-'+Date.now(),date:todayISO(),type:'HIIT',status:'Erledigt',duration:Math.ceil(totalSecs/60),note:'HIIT JX · Timer abgeschlossen · 60 Intervalle',rpe:null,exercises:[],imported:false};db.sessions.push(s);timer.recorded=true;persist();toast('HIIT-Einheit dokumentiert ✓');renderHiit()}
function barNum(name,val,color){return `<span class="tag ${name.toLowerCase()}">${name}</span> <strong>${val}</strong>`}
function liftOptions(){return [...new Set(Object.values(db.plan).flatMap(a=>a.map(x=>x.name)))]}
function strengthValues(name){const items=done().filter(s=>(s.exercises||[]).some(x=>x.name===name)).sort((a,b)=>a.date.localeCompare(b.date));const records=items.map(s=>({date:s.date,kg:Math.max(...(s.exercises.find(x=>x.name===name).sets||[]).map(t=>Number(t.kg)||0))})).filter(x=>x.kg>0);return records}
function renderProgress(){const wl=weekSeries(10),vol=done().reduce((t,s)=>t+loggedVolume(s),0);const all=done();const hiitCount=all.filter(x=>x.type==='HIIT').length;const opt=liftOptions();if(!opt.includes(weightMetric))weightMetric=opt[0]||'';const strength=strengthValues(weightMetric).slice(-12);const body=[...db.body].sort((a,b)=>a.date.localeCompare(b.date));const bodyRecent=body.slice(-12);document.getElementById('view-progress').innerHTML=`<div class="stat-grid"><div class="stat"><div class="stat-label">TRAININGSEINHEITEN</div><div class="stat-value">${all.length}</div><div class="stat-foot">Seit Beginn der Historie</div></div><div class="stat"><div class="stat-label">HIIT ABSOLVIERT</div><div class="stat-value">${hiitCount}</div><div class="stat-foot">Dokumentierte HIIT-Einheiten</div></div><div class="stat"><div class="stat-label">TRAININGSVOLUMEN</div><div class="stat-value">${compact(vol)} <span style="font-size:13px">kg</span></div><div class="stat-foot">Nur gespeicherte Satzwerte</div></div><div class="stat"><div class="stat-label">KÖRPERGEWICHT</div><div class="stat-value">${body.length?formatWeight(body.at(-1).kg):'–'} <span style="font-size:13px">kg</span></div><div class="stat-foot">${body.length?niceDate(body.at(-1).date):'Noch kein Messwert'}</div></div></div><div class="grid-2"><div class="panel"><div class="panel-heading"><div><h3>Trainingseinheiten / Woche</h3><p class="sub">Die letzten 10 Wochen nach Typ</p></div></div>${stackedChart(wl)}</div><div class="panel"><div class="panel-heading"><div><h3>Trainingsvolumen / Woche</h3><p class="sub">kg × Wiederholungen, ohne Schätzung</p></div></div>${wl.some(w=>w.volume>0)?lineChart(wl.map(x=>x.volume),wl.map(x=>x.label),COLORS.Leg):'<div class="empty">Noch keine Satzgewichte in den Trainingseinheiten protokolliert.<br>Starte eine neue PPL-Einheit für die Volumenkurve.</div>'}</div></div><div class="grid-2"><div class="panel"><div class="panel-heading"><div><h3>Kraftverlauf nach Übung</h3><p class="sub">Maximal dokumentiertes Satzgewicht</p></div><select class="input" style="max-width:205px" id="lift-select">${opt.map(o=>`<option value="${esc(o)}" ${o===weightMetric?'selected':''}>${esc(o)}</option>`).join('')}</select></div>${strength.length?lineChart(strength.map(x=>x.kg),strength.map(x=>niceDate(x.date,{day:'2-digit',month:'2-digit'})),COLORS.Pull,' kg'):'<div class="empty">Für diese Übung liegen noch keine bestätigten Satzwerte vor. Neue Trainingsdaten erzeugen hier automatisch einen Verlauf.</div>'}<p class="note">Gegengewicht bei unterstützten Klimmzügen ist nicht direkt mit gehobener Last vergleichbar.</p></div><div class="panel"><div class="panel-heading"><div><h3>Gewichtsverlauf</h3><p class="sub">Körpergewicht freiwillig dokumentieren</p></div></div>${bodyRecent.length?lineChart(bodyRecent.map(x=>x.kg),bodyRecent.map(x=>niceDate(x.date,{day:'2-digit',month:'2-digit'})),COLORS.Leg,' kg'):'<div class="empty">Noch keine Körpergewichts-Messungen vorhanden.</div>'}<div class="divider"></div><div class="row-inline"><div class="field" style="flex:1;min-width:125px"><label for="body-date">Datum</label><input id="body-date" class="input" type="date" value="${todayISO()}"></div><div class="field" style="flex:1;min-width:95px"><label for="body-value">Gewicht (kg)</label><input id="body-value" class="input" type="number" step="0.1" min="20" max="400" inputmode="decimal" placeholder="z. B. 96,5"></div><button class="btn" style="margin-top:17px" data-action="save-body">+ Eintragen</button></div>${body.length?`<div class="weight-list" style="max-height:180px;overflow:auto;margin-top:12px">${body.slice().reverse().slice(0,12).map(r=>`<div class="activity-row"><span>${niceDate(r.date)}</span><div class="row-inline"><strong>${formatWeight(r.kg)} kg</strong><button class="btn tiny danger" data-action="delete-body" data-date="${r.date}">×</button></div></div>`).join('')}</div>`:''}</div></div>`}
function renderSettings(){const total=db.sessions.length;let bytes=0;try{bytes=new Blob([JSON.stringify(db)]).size}catch(e){}document.getElementById('view-settings').innerHTML=`<div class="settings-grid"><div class="panel"><div class="panel-heading"><div><h3>Trainingsziele</h3><p class="sub">Jederzeit anpassbar</p></div></div><div class="field"><label for="weekly-goal">Trainingseinheiten pro Woche</label><select class="input" id="weekly-goal">${Array.from({length:7},(_,i)=>`<option value="${i+1}" ${db.settings.weeklyGoal===i+1?'selected':''}>${i+1} Trainingseinheiten</option>`).join('')}</select></div><div class="divider"></div><div class="info-list"><div><strong>PPL-Split:</strong> Push · Pull · Legs</div><div><strong>HIIT:</strong> ${secsToStr(totalSecs)} Gesamtzeit, davon ${secsToStr(activeSecs)} aktiv</div><div><strong>Gespeicherte Einträge:</strong> ${total}</div><div><strong>Datenvolumen:</strong> ca. ${Math.round(bytes/1024)} KB</div></div></div><div class="panel"><div class="panel-heading"><div><h3>Backup & Export</h3><p class="sub">Daten übertragen, sichern und auswerten</p></div></div><div class="rows"><button class="btn" data-action="export-json">↓ Gesamtes Backup (.json)</button><button class="btn secondary" data-action="import-json">↑ Backup wiederherstellen</button><button class="btn secondary" data-action="export-csv">↓ Trainingseinheiten (.csv)</button></div><p class="note">Bei Wechsel des Geräts, des Browsers oder der Webadresse das JSON-Backup exportieren und anschließend importieren. Es enthält auch deinen Trainingsplan und Messwerte.</p></div></div><div class="panel"><div class="panel-heading"><h3>Datenschutz & Offline-Nutzung</h3></div><div class="info-list"><div><strong>Deine Daten bleiben lokal:</strong> Kein Login, keine Cloud-Synchronisierung, keine Analytics. Deine Trainingsdaten werden im Speicher dieses Browsers gehalten. Nutze private Backups.</div><div><strong>Installation:</strong> Für die zuverlässige Android-Installation die PWA-Dateien auf einer HTTPS-Adresse bereitstellen und in Chrome „App installieren“ wählen.</div><div><strong>Ohne Internet:</strong> Eine installierte App bleibt dank Offline-Cache nutzbar. Die einzelne HTML-Datei funktioniert ohne Netz, kann aber je nach Android-Datei-App Daten unterschiedlich speichern.</div><div><strong>Wichtig:</strong> Löschen von Browserdaten oder Wechsel der Webadresse kann lokal gespeicherte Daten entfernen. Erstelle regelmäßig ein JSON-Backup.</div></div><div class="divider"></div><button class="btn danger" data-action="reset-all">Alle Trainingsdaten zurücksetzen</button><p class="note">Mit Bestätigung werden alle lokal gespeicherten Einträge entfernt. Importiere deine private JSON-Sicherung erneut, um deine Historie wiederherzustellen.</p></div>`}
function csvCell(x){return `"${String(x??'').replaceAll('"','""')}"`}
function exportText(content,name,type){const blob=new Blob([content],{type});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportJSON(){exportText(JSON.stringify({exportedAt:new Date().toISOString(),app:'Workout JX',data:db},null,2),`Workout_JX_Backup_${todayISO()}.json`,'application/json')}
function exportCSV(){const columns=['Datum','Typ','Status','Dauer_min','RPE','Volumen_kg','Sätze','Notiz','Importiert'];const lines=[columns.map(csvCell).join(';'),...db.sessions.sort((a,b)=>a.date.localeCompare(b.date)).map(s=>[s.date,s.type,s.status,s.duration,s.rpe,loggedVolume(s),(s.exercises||[]).reduce((n,e)=>n+(e.sets||[]).length,0),s.note||'',s.imported?'Ja':'Nein'].map(csvCell).join(';'))];exportText('\ufeff'+lines.join('\r\n'),`Workout_JX_Einheiten_${todayISO()}.csv`,'text/csv;charset=utf-8')}
async function importJSON(file){if(!file||file.size>6_000_000)return toast('Datei fehlt oder ist zu groß.');try{const raw=JSON.parse(await file.text());const d=raw.data||raw;if(!Array.isArray(d.sessions)||!d.plan||!Array.isArray(d.body))throw Error('Format');if(d.sessions.length>20000||d.body.length>10000)throw Error('Zu viele Datensätze');if(!confirm(`Backup mit ${d.sessions.length} Trainingseinträgen importieren? Dein aktueller Stand wird ersetzt.`))return;db={version:2,sessions:d.sessions.filter(x=>x&&typeof x.date==='string'&&['Push','Pull','Leg','HIIT'].includes(x.type)),body:d.body,plan:d.plan,settings:{weeklyGoal:3,sound:true,vibrate:true,...(d.settings||{})}};persist();go('dashboard');toast('Backup erfolgreich importiert ✓')}catch(e){toast('Kein gültiges Workout-JX-Backup.')}}
function resetAll(){if(!confirm('Zurücksetzen? Neue Trainingsprotokolle und Änderungen gehen verloren.'))return;if(!confirm('Letzte Bestätigung: Alle lokalen Trainingsdaten löschen? Vorher Backup exportieren!'))return;db=mkDb();persist();go('dashboard');toast('Lokale Daten gelöscht. Private Sicherung kann erneut importiert werden.')}
function onAction(name,button){if(name==='new-session')return beginTraining(button.dataset.date||todayISO());if(name==='month-prev'){month.setMonth(month.getMonth()-1);return renderCalendar()}if(name==='month-next'){month.setMonth(month.getMonth()+1);return renderCalendar()}if(name==='month-today'){month=new Date();selectedDay=todayISO();return renderCalendar()}if(name==='close-modal')return document.getElementById('modal').close();if(name==='begin-training')return beginTraining(todayISO(),split);if(name==='stop-training'){capture=false;draft=null;return renderTraining()}if(name==='save-session')return saveSession();if(name==='delete-session')return deleteSession(button.dataset.id);if(name==='edit-session')return editSession(button.dataset.id);if(name==='add-exercise'){const str=prompt('Name der neuen Übung:');if(!str||!str.trim())return;db.plan[split].push({name:str.trim().slice(0,80),sets:[{kg:null,reps:10},{kg:null,reps:10},{kg:null,reps:10}]});persist();return renderTraining()}if(name==='remove-exercise'){const ix=+button.dataset.index;if(!confirm('Übung aus der Vorlage entfernen?'))return;db.plan[split].splice(ix,1);persist();return renderTraining()}if(name==='add-set'||name==='remove-set'){const e=db.plan[split][+button.dataset.index];if(!e)return;if(name==='add-set'&&e.sets.length<10)e.sets.push({kg:null,reps:10});if(name==='remove-set'&&e.sets.length>1)e.sets.pop();persist();return renderTraining()}if(name==='save-body'){const date=document.getElementById('body-date').value;const n=Number(document.getElementById('body-value').value.replace(',','.'));if(!date||!Number.isFinite(n)||n<20||n>400||!document.getElementById('body-value').value)return toast('Bitte gültiges Gewicht und Datum eingeben.');db.body=db.body.filter(x=>x.date!==date);db.body.push({date,kg:n});persist();return renderProgress()}if(name==='delete-body'){if(!confirm('Messwert löschen?'))return;db.body=db.body.filter(x=>x.date!==button.dataset.date);persist();return renderProgress()}if(name==='timer-toggle'){timer.running?pauseTimer():startTimer();return renderHiit()}if(name==='timer-reset')return resetTimer();if(name==='timer-back')return skipPhase(-1);if(name==='timer-forward')return skipPhase(1);if(name==='timer-save')return recordHiit();if(name==='export-json')return exportJSON();if(name==='export-csv')return exportCSV();if(name==='import-json')return document.getElementById('import-file').click();if(name==='reset-all')return resetAll()}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){if(document.getElementById('modal').open)document.getElementById('modal').close();return go(nav.dataset.nav)}const b=e.target.closest('[data-action]');if(b)onAction(b.dataset.action,b);const t=e.target.closest('[data-split]');if(t){split=t.dataset.split;return renderTraining()}const day=e.target.closest('[data-day]');if(day){openDay(day.dataset.day);renderCalendar()}});
document.addEventListener('change',e=>{const x=e.target;if(x.dataset.setField){const scope=x.dataset.scope;const eidx=Number(x.dataset.ex),sidx=Number(x.dataset.set),field=x.dataset.setField;const target=scope==='plan'?db.plan[split]:draft?.exercises;const set=target?.[eidx]?.sets?.[sidx];if(set){const raw=x.value.trim();const n=raw===''?null:Number(raw);if(n!==null&&(!Number.isFinite(n)||n<0||n>1000)){toast('Ungültiger Satzwert');return}set[field]=n;if(scope==='plan')persist()}return}if(x.id.startsWith('train-'))return updateDraftField(x.id,x.value);if(x.id==='weekly-goal'){db.settings.weeklyGoal=Number(x.value);persist();return toast('Wochenziel gespeichert')}if(x.id==='sound-toggle'){db.settings.sound=x.checked;persist()}if(x.id==='vibrate-toggle'){db.settings.vibrate=x.checked;persist()}if(x.id==='lift-select'){weightMetric=x.value;renderProgress()}});
document.getElementById('import-file').addEventListener('change',e=>{importJSON(e.target.files[0]);e.target.value=''});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.target.close()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&timer.running)acquireWake()});
window.addEventListener('pagehide',()=>releaseWake());
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
go('dashboard');
</script></body></html>
